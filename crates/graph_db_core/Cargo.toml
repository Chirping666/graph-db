[package]
name = "graph_db_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Core types, traits, and error hierarchy for graph_db (no_std + alloc)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/user/graph-db"
readme = "README.md"
keywords = ["graph-database", "embedded-database", "property-graph", "no-std"]
categories = ["database-implementations", "data-structures", "no-std"]

[features]
default = ["std"]
std = ["alloc"]
alloc = []

[dev-dependencies]
tempfile = "3"
