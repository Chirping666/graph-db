[workspace]
members = [".", "crates/phonograph", "crates/phonograph_db"]
resolver = "2"

[package]
name = "graph_db"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "An embedded graph database with extensible schema, pluggable constraint validation, and pluggable inference hooks"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Chirping666/graph-db"
documentation = "https://docs.rs/graph_db"
readme = "README.md"
keywords = ["graph-database", "embedded-database", "property-graph", "ontology", "knowledge-graph"]
categories = ["database-implementations", "data-structures"]
exclude = [
    "archive/",
    "fuzz/",
    "030-workspace-redesign.md",
    "CLAUDE.md",
]

[dependencies]
phonograph = { path = "crates/phonograph" }
crc32fast = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
