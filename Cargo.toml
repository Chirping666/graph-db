[package]
name = "graph_db"
version = "0.1.0"
edition = "2024"

[features]
default = ["std"]
std = ["alloc", "libc"]
alloc = []

[dependencies]
crc32fast = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[dev-dependencies]
tempfile = "3"
